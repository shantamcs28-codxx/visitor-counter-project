<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">Visitor Counter - Hybrid Kubernetes Architecture</text>

  <rect x="340" y="50" width="220" height="50" rx="8" fill="#e8f0fe" stroke="#3367d6"/>
  <text x="450" y="72" text-anchor="middle" font-weight="bold">User / Browser</text>
  <text x="450" y="90" text-anchor="middle">http://localhost:8080</text>

  <rect x="340" y="130" width="220" height="60" rx="8" fill="#fff4e5" stroke="#e8710a"/>
  <text x="450" y="154" text-anchor="middle" font-weight="bold">Failover Gateway (nginx)</text>
  <text x="450" y="174" text-anchor="middle">primary: private | backup: public</text>
  <line x1="450" y1="100" x2="450" y2="130" stroke="#333" marker-end="url(#a)"/>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>

  <!-- private -->
  <rect x="30" y="230" width="410" height="270" rx="10" fill="#f1f8f4" stroke="#188038" stroke-width="2"/>
  <text x="235" y="254" text-anchor="middle" font-weight="bold" fill="#188038">PRIVATE cluster (kind: private) :8081</text>
  <rect x="50" y="270" width="370" height="50" rx="6" fill="#fff" stroke="#188038"/>
  <text x="235" y="290" text-anchor="middle">Service: web (NodePort 30080)</text>
  <text x="235" y="308" text-anchor="middle" font-size="11">readiness /ready | liveness /healthz</text>
  <rect x="50" y="335" width="370" height="85" rx="6" fill="#fff" stroke="#188038"/>
  <text x="235" y="353" text-anchor="middle">Deployment: web (Flask+gunicorn)</text>
  <rect x="65" y="362" width="100" height="45" rx="4" fill="#e6f4ea" stroke="#188038"/><text x="115" y="389" text-anchor="middle">Pod 1</text>
  <rect x="180" y="362" width="100" height="45" rx="4" fill="#e6f4ea" stroke="#188038"/><text x="230" y="389" text-anchor="middle">Pod 2</text>
  <rect x="295" y="362" width="110" height="45" rx="4" fill="#fff" stroke="#188038" stroke-dasharray="4"/><text x="350" y="381" text-anchor="middle" font-size="11">HPA: 2..6 pods</text><text x="350" y="396" text-anchor="middle" font-size="11">CPU 50%</text>
  <rect x="50" y="435" width="370" height="50" rx="6" fill="#fff" stroke="#188038"/>
  <text x="235" y="457" text-anchor="middle">Deployment + Service: redis</text>
  <text x="235" y="474" text-anchor="middle" font-size="11">visit counter (INCR visits)</text>

  <!-- public -->
  <rect x="460" y="230" width="410" height="270" rx="10" fill="#fef7f0" stroke="#e8710a" stroke-width="2"/>
  <text x="665" y="254" text-anchor="middle" font-weight="bold" fill="#e8710a">PUBLIC cluster (kind: public, simulated) :8082</text>
  <rect x="480" y="270" width="370" height="50" rx="6" fill="#fff" stroke="#e8710a"/>
  <text x="665" y="290" text-anchor="middle">Service: web (NodePort 30080)</text>
  <text x="665" y="308" text-anchor="middle" font-size="11">readiness /ready | liveness /healthz</text>
  <rect x="480" y="335" width="370" height="85" rx="6" fill="#fff" stroke="#e8710a"/>
  <text x="665" y="353" text-anchor="middle">Deployment: web (Flask+gunicorn)</text>
  <rect x="495" y="362" width="100" height="45" rx="4" fill="#fdecd8" stroke="#e8710a"/><text x="545" y="389" text-anchor="middle">Pod 1</text>
  <rect x="610" y="362" width="100" height="45" rx="4" fill="#fdecd8" stroke="#e8710a"/><text x="660" y="389" text-anchor="middle">Pod 2</text>
  <rect x="725" y="362" width="110" height="45" rx="4" fill="#fff" stroke="#e8710a" stroke-dasharray="4"/><text x="780" y="381" text-anchor="middle" font-size="11">HPA: 2..6 pods</text><text x="780" y="396" text-anchor="middle" font-size="11">CPU 50%</text>
  <rect x="480" y="435" width="370" height="50" rx="6" fill="#fff" stroke="#e8710a"/>
  <text x="665" y="457" text-anchor="middle">Deployment + Service: redis</text>
  <text x="665" y="474" text-anchor="middle" font-size="11">visit counter (INCR visits)</text>

  <line x1="400" y1="190" x2="235" y2="230" stroke="#188038" stroke-width="2" marker-end="url(#a)"/>
  <text x="285" y="205" fill="#188038" font-size="12">primary</text>
  <line x1="500" y1="190" x2="665" y2="230" stroke="#e8710a" stroke-width="2" stroke-dasharray="6" marker-end="url(#a)"/>
  <text x="590" y="205" fill="#e8710a" font-size="12">failover</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
