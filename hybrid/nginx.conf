events {}
http {
  upstream hybrid {
    server host.docker.internal:8081 max_fails=1 fail_timeout=5s;        # private (primary)
    server host.docker.internal:8082 backup;                              # public  (failover)
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://hybrid;
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
